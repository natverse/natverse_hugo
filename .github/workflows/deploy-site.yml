name: Build and Deploy Site

on:
  push:
    branches:
      - dev_pages
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source repo
        uses: actions/checkout@v4

      - name: Install Hugo 0.54.0
        run: |
          wget -q https://github.com/gohugoio/hugo/releases/download/v0.54.0/hugo_0.54.0_Linux-64bit.tar.gz
          tar xf hugo_0.54.0_Linux-64bit.tar.gz
          sudo mv hugo /usr/local/bin/hugo
          hugo version

      - name: Build site
        run: hugo --gc --minify

      - name: Load deploy key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.PAGES_REPO_SSH_KEY }}

      - name: Trust github.com host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan github.com >> ~/.ssh/known_hosts

      - name: Deploy to natverse.github.io
        run: |
          git clone git@github.com:natverse/natverse.github.io.git /tmp/site
          rsync -av --delete --exclude ".git/" public/ /tmp/site/
          cd /tmp/site
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Deploy from natverse_hugo ${GITHUB_SHA}"
          git push origin master
